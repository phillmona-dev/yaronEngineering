# Production overrides for Contabo VPS (207.180.201.199)
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Port mapping on the host:
#   5435  → postgres
#   8082  → Spring Boot backend
#   3002  → Next.js frontend
# Nginx on :8088 reverse-proxies both under a single origin.

services:
  postgres:
    ports:
      - "5435:5432"

  backend:
    ports:
      - "8082:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/yaron_blog
      DATABASE_USERNAME: yaron
      DATABASE_PASSWORD: ${DB_PASSWORD:-yaron}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@yaronengineering.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      ADMIN_NAME: ${ADMIN_NAME:-Yaron Admin}
      CORS_ALLOWED_ORIGINS: http://207.180.201.199:8088
      MEDIA_STORAGE_PATH: /data/media
      MEDIA_PUBLIC_BASE_URL: http://207.180.201.199:8088
      REVALIDATE_URL: http://frontend:3000/api/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      SEED_SAMPLE_CONTENT: ${SEED_SAMPLE_CONTENT:-false}
      FRONTEND_URL: http://207.180.201.199:8088
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@yaronengineering.com}

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: http://207.180.201.199:8088
        NEXT_PUBLIC_API_URL: http://207.180.201.199:8088
    ports:
      - "3002:3000"
    environment:
      API_URL: http://backend:8080
      NEXT_PUBLIC_API_URL: http://207.180.201.199:8088
      NEXT_PUBLIC_SITE_URL: http://207.180.201.199:8088
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      COOKIE_SECURE: "false"
