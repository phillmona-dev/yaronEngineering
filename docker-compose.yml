# Base service definitions — no port bindings here.
# Dev:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#       Frontend http://localhost:3000 · API http://localhost:8080 · PostgreSQL localhost:5433
# Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#       Served via Nginx on :8088 (frontend :3002, backend :8082, postgres :5435)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yaron_blog
      POSTGRES_USER: yaron
      POSTGRES_PASSWORD: yaron
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaron -d yaron_blog"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/yaron_blog
      DATABASE_USERNAME: yaron
      DATABASE_PASSWORD: yaron
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me-0123456789}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@yaronengineering.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      ADMIN_NAME: ${ADMIN_NAME:-Yaron Admin}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      MEDIA_STORAGE_PATH: /data/media
      MEDIA_PUBLIC_BASE_URL: http://localhost:8080
      REVALIDATE_URL: http://frontend:3000/api/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-revalidate-secret}
      SEED_SAMPLE_CONTENT: ${SEED_SAMPLE_CONTENT:-true}
      FRONTEND_URL: http://localhost:3000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@yaronengineering.com}
    volumes:
      - media:/data/media
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://backend:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-revalidate-secret}

volumes:
  pgdata:
  media:
