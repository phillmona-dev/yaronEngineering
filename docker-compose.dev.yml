# Local development port bindings.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Frontend http://localhost:3000 · API http://localhost:8080 · PostgreSQL localhost:5433
services:
  postgres:
    ports:
      - "5433:5432"

  backend:
    ports:
      - "8080:8080"

  frontend:
    ports:
      - "3000:3000"
