spring:
  application:
    name: yaron-blog-api
  autoconfigure:
    # JWT auth with our own UserRepository — no generated default user/password.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/yaron_blog}
    username: ${DATABASE_USERNAME:yaron}
    password: ${DATABASE_PASSWORD:yaron}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_SIZE_MB:8}MB
      max-request-size: ${MEDIA_MAX_SIZE_MB:8}MB
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl-seconds: ${JWT_TTL_SECONDS:43200}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Administrator}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  media:
    storage-path: ${MEDIA_STORAGE_PATH:./data/media}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:8080}
    max-size-mb: ${MEDIA_MAX_SIZE_MB:8}
  revalidate:
    url: ${REVALIDATE_URL:}
    secret: ${REVALIDATE_SECRET:}
  seed:
    sample-content: ${SEED_SAMPLE_CONTENT:false}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"
  level:
    com.yaronengineering.blog: INFO
